name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... && go vet ./...
      - name: Build packages
        run: ./build-all.sh && ./package-release.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/BiliGreen-Linux-amd64.tar.gz
            release/BiliGreen-Linux-arm64.tar.gz
            release/BiliGreen-Windows-amd64.zip
            release/BiliGreen-Windows-arm64.zip
